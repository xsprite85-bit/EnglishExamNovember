<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אנגלית ה'1">
<style>:root{color-scheme:light}[hidden]{display:none!important}</style>
<title>Grade 5 English Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Home lists the nine syllabus topics in the school's own numbering; a topic lists its exercises; an exercise is one question per screen. */
:root{
  --bg:#FFFCF4; --surface:#FFFFFF; --fg:#2B1608; --muted:#7A6350; --line:#EBDDCB;
  --accent:#FF6115; --accent-fg:#2B1608; --hi:#FFD55A; --hi-fg:#3B2D00; --sky:#FFEBDD;
  --good:#13804F; --good-bg:#DCF4E7; --bad:#B93434; --bad-bg:#FBE2E2;
  --display:'Fredoka','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E140D; --surface:#2A1D13; --fg:#FFF4E6; --muted:#C2AA94; --line:#4A3626;
  --accent:#FF6115; --accent-fg:#1E140D; --sky:#3A2718;
  --good:#5BD49B; --good-bg:#153827; --bad:#FF8F8F; --bad-bg:#432024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E140D; --surface:#2A1D13; --fg:#FFF4E6; --muted:#C2AA94; --line:#4A3626;
  --accent:#FF6115; --accent-fg:#1E140D; --sky:#3A2718;
  --good:#5BD49B; --good-bg:#153827; --bad:#FF8F8F; --bad-bg:#432024; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-block:16px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:620px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
bdi.en,.en{unicode-bidi:isolate}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:1.35rem}
.icon{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.icon svg{width:22px;height:22px;fill:currentColor}

.hero{margin:6px 0 4px}
.hero h1{font-size:2.3rem;line-height:1.1}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:.9rem}
.lead{margin:8px 0 0;color:var(--muted)}
.mock{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin:18px 0;padding:16px 18px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);cursor:pointer;text-align:start}
.mock-t{font-family:var(--display);font-size:1.4rem}
.mock-s{opacity:.9;font-size:.95rem}
.topics{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.topic{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;cursor:pointer;text-align:start;font-size:1rem}
.tile{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;color:#fff;background:hsl(var(--h) 60% 40%)}
.tt{display:grid;min-width:0;flex:1}
.tt b{font-weight:600;font-size:1.08rem}
.tt .sub{color:var(--muted);font-size:.88rem}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--good)}
.foot{margin:18px 0 0;color:var(--muted);font-size:.85rem}

.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;cursor:pointer;text-align:start;font-size:1rem}
.mode .tt{flex:1}
.best{flex:none;font-size:.85rem;font-weight:600;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 10px}

.prog{display:flex;align-items:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.prog .meter{flex:1;margin:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.ins{margin:0;color:var(--muted);font-size:.95rem}
.q{margin:0;font-family:var(--display);font-size:1.55rem;line-height:1.3;text-wrap:balance}
.vis{display:grid;place-items:center}
.scene{width:100%;max-width:340px;background:var(--sky);border-radius:12px}
.s-box{fill:#C98F4F}.s-lid{fill:#A8712F}.s-wood{fill:#8B5E34}.s-floor{fill:var(--line)}
.clock{width:150px;max-width:100%}
.c-face{fill:var(--surface);stroke:var(--fg);stroke-width:3}
.c-tick{stroke:var(--fg);stroke-width:1.5}
.c-num{fill:var(--fg);font-size:8px;font-family:var(--body)}
.c-h{stroke:var(--fg);stroke-width:4;stroke-linecap:round}
.c-m{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.c-dot{fill:var(--accent)}
.digi{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.row{display:flex;flex-wrap:wrap}
.opt{min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font-size:1.12rem;cursor:pointer;text-align:center}
.opts.row .opt{flex:1 1 auto}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .clock{width:100%;max-width:120px}
.opt .scene{max-width:100%}
.fb{min-height:1.5em;font-weight:500}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.btn{padding:13px 22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:1.05rem;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--hi);text-align:center}
.hi{background:var(--hi);color:var(--hi-fg);border-radius:4px;padding:0 .2em}
.tag{font-family:var(--body);font-size:.75rem;background:var(--hi);color:var(--hi-fg);border-radius:6px;padding:1px 7px;vertical-align:middle}
.txt{width:100%;font:inherit;font-size:1.3rem;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg)}
.rub{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:3px;font-weight:400}
.rub li::before{content:"\2713\00a0";color:var(--good);font-weight:600}
.rub li.no::before{content:"\2717\00a0";color:var(--bad)}
.bank{margin:0;font-size:.9rem;color:var(--muted);direction:ltr;text-align:left}
.frame{font-size:1.2rem;color:var(--muted)}
.passage{direction:ltr;text-align:left;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.05rem;line-height:1.55}
.passage p{margin:.25em 0}
.gloss{margin:0;font-size:.85rem;color:var(--muted)}

.score{text-align:center;display:grid;gap:12px;justify-items:center;padding:26px 18px}
.score .big{font-family:var(--display);font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card3d{min-height:210px;display:grid;place-items:center;gap:8px;text-align:center;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer;width:100%;color:var(--fg)}
.card3d .w{font-family:var(--display);font-size:2.6rem;line-height:1.15}
.card3d .h{font-size:2rem;font-weight:500}
.vtable{display:grid;gap:18px}
.vtable h2{font-size:1.1rem;margin-bottom:6px}
.vrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.vrow .e{font-family:var(--display);font-size:1.15rem;direction:ltr;text-align:left}
.vrow .hh{color:var(--muted)}
.vrow .icon{width:38px;height:38px}
.star{width:1.1em;height:1.1em;fill:#F5B301;vertical-align:-0.2em}
.starcount{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--fg)}
.plus{display:inline-flex;align-items:center;gap:3px;color:var(--fg);background:var(--hi);color:var(--hi-fg);border-radius:999px;padding:0 8px;font-size:.9rem}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;width:100%;margin:16px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:inherit;cursor:pointer;text-align:start;font-size:1rem}
.stats .bigstar{grid-row:span 2;display:grid;justify-items:center;line-height:1}
.stats .bigstar .star{width:44px;height:44px}
.stats .bigstar b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats .lv{display:grid;gap:2px;min-width:0}
.stats .lv b{font-family:var(--display);font-size:1.15rem}
.stats .mini{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.earn{margin:0;font-family:var(--display);font-size:1.6rem}
.lvup{margin:0;padding:10px 14px;border-radius:12px;background:var(--hi);color:var(--hi-fg)}
.ladder{display:grid;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.ladder li{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);opacity:.55}
.ladder li.got{opacity:1}
.ladder li .n{margin-inline-start:auto;color:var(--muted);font-size:.88rem}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.badge{display:grid;justify-items:center;gap:4px;width:92px;text-align:center;font-size:.8rem}
.badge .tile{width:52px;height:52px;opacity:.28}
.badge.got .tile{opacity:1}
.sec{margin:20px 0 8px;font-size:1.1rem}
.ta{width:100%;min-height:84px;font:inherit;font-size:.85rem;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);direction:ltr;text-align:left;word-break:break-all}
.dash{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel h2{font-size:1.1rem}
.hero2{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:104px;height:104px}
.ring .bg{fill:none;stroke:var(--line);stroke-width:10}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px}
.ring text{fill:var(--fg);font-family:var(--display);font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{display:grid}
.kpi b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.85rem}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.dot.m{background:var(--good)}.dot.p{background:var(--hi)}.dot.n{background:var(--line)}
.seg{display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.seg .sm{background:var(--good)}.seg .sp{background:var(--hi)}
.trow{display:grid;gap:4px}
.trow .l{display:flex;justify-content:space-between;gap:10px}
.trow .l span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.wcs{display:flex;flex-wrap:wrap;gap:6px}
.wc{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer;font-size:.92rem}
.wc.st-m{background:var(--good-bg);border-color:var(--good);color:var(--fg)}
.wc.st-p{background:var(--hi);border-color:var(--hi);color:var(--hi-fg)}
.wdet{padding:10px 12px;border-radius:12px;background:var(--sky);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.dd{border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.dd summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.il{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.92rem}
.il li{padding:4px 8px;border-radius:8px}
.il li.st-m{background:var(--good-bg)}.il li.st-p{background:var(--hi);color:var(--hi-fg)}.il li.st-n{color:var(--muted)}
.chart{width:100%;height:auto}
.ch-base{stroke:var(--line);stroke-width:1}
.ch-bar{fill:var(--accent)}
.ch-t{fill:var(--muted);font-size:9px;font-family:var(--body)}
.ch-v{fill:var(--fg);font-size:10px;font-weight:600;font-family:var(--body)}
.wk{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.wk:last-of-type{border-bottom:0}

.cdown{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin:14px 0 0;padding:12px 16px;border-radius:16px;background:var(--surface);border:2px dashed var(--accent)}
.cd-n{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cd-t{font-family:var(--display);font-size:1.15rem}
.cd-r{margin-inline-start:auto;color:var(--muted);font-size:.88rem}
.daily{display:grid;gap:2px;width:100%;margin-top:10px;padding:14px 16px;border-radius:16px;border:2px solid var(--hi-fg);background:var(--hi);color:var(--hi-fg);cursor:pointer;text-align:start;font-size:1rem}
.dl-k{font-size:.85rem;font-weight:600;letter-spacing:.02em}
.dl-t{font-family:var(--display);font-size:1.3rem}
.dl-s{font-size:.9rem}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.stk{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);color:var(--muted);font-size:.85rem;text-align:center;font-family:inherit}
.stk.got{border-style:solid;border-color:var(--accent);background:var(--surface);color:var(--fg);cursor:pointer}
.se{font-size:2.2rem;line-height:1.1}
.se.lock{font-family:var(--display);color:var(--line)}
.need{font-size:.75rem}
.newstk{display:grid;gap:8px;justify-items:center}
.nsrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.burst{position:fixed;left:50%;top:38%;width:0;height:0;pointer-events:none;z-index:50}
.burst span{position:absolute;left:-11px;top:-11px;animation:fly 1s ease-out forwards}
.burst .star{width:22px;height:22px}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.plus{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.btn.wa{background:#25D366;color:#073B1A}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,10,4,.78);display:grid;place-items:center;padding:16px;overflow:auto}
.ovb{display:grid;gap:12px;justify-items:center;max-width:420px;background:var(--surface);color:var(--fg);padding:14px;border-radius:18px}
.ovb img{width:100%;max-width:300px;border-radius:12px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="he"></div>

<script>
(function(){
'use strict';
var $app=document.getElementById('app');
var TTS=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
function say(t){if(!TTS)return;try{var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.82;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

var prog={};
try{prog=JSON.parse(localStorage.getItem('g5eng')||'{}')||{};}catch(e){prog={};}
function saveProg(){try{localStorage.setItem('g5eng',JSON.stringify(prog));}catch(e){}}
/* Saved data lives in localStorage under fixed keys. Updates only ever add fields, so existing stars and scores stay. */
var meta={v:1,stars:0,name:'',streak:0,last:'',todayD:'',today:0,hist:{}};
try{var m0=JSON.parse(localStorage.getItem('g5eng-meta')||'null');if(m0&&typeof m0==='object'){for(var mk0 in m0){meta[mk0]=m0[mk0];}}}catch(e){}
function saveMeta(){try{localStorage.setItem('g5eng-meta',JSON.stringify(meta));}catch(e){}}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var STAR='<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>';
var LEVELS=[[0,'Rookie','מתחילים'],[25,'Word Explorer','חוקרי מילים'],[75,'Word Hunter','צדי מילים'],[150,'Word Knight','אבירי מילים'],[300,'Word Master','אדוני המילים'],[500,'English Champion','אלופי האנגלית']];
function levelOf(s){var r=0;for(var k=0;k<LEVELS.length;k++){if(s>=LEVELS[k][0])r=k;}return r;}
function touchDay(){
  var t=dstr();
  if(meta.last!==t){var y=new Date();y.setDate(y.getDate()-1);meta.streak=(meta.last===dstr(y))?meta.streak+1:1;meta.last=t;}
  if(meta.todayD!==t){meta.todayD=t;meta.today=0;}
}
function addStars(n){touchDay();meta.stars+=n;meta.today+=n;if(!meta.hist||typeof meta.hist!=='object')meta.hist={};var dk=dstr();meta.hist[dk]=(meta.hist[dk]||0)+n;saveMeta();}
var items={};
try{items=JSON.parse(localStorage.getItem('g5eng-items')||'{}')||{};}catch(e){items={};}
function saveItems(){try{localStorage.setItem('g5eng-items',JSON.stringify(items));}catch(e){}}
/* per item: s = correct first tries in a row, c = total correct, w = total wrong. Mastered when s>=2. */
function rec(id,first){var r=items[id]||(items[id]={s:0,c:0,w:0});if(first){r.s++;r.c++;}else{r.s=0;r.w++;}saveItems();}
function streakNow(){var t=dstr(),y=new Date();y.setDate(y.getDate()-1);return (meta.last===t||meta.last===dstr(y))?meta.streak:0;}
function todayStars(){return meta.todayD===dstr()?meta.today:0;}

/* ---------- data ---------- */

function mc4(correct,pool,n){
  n=n||4;
  var d=shuffle(pool.filter(function(x,i){return x!==correct&&pool.indexOf(x)===i;})).slice(0,n-1);
  return shuffle([correct].concat(d)).map(function(x){return {t:esc(x),ok:x===correct};});
}

  function hand(ang,len,cls){var r=ang*Math.PI/180;return '<line x1="50" y1="50" x2="'+(50+Math.sin(r)*len).toFixed(1)+'" y2="'+(50-Math.cos(r)*len).toFixed(1)+'" class="'+cls+'"/>';}
  return '<svg viewBox="0 0 100 100" class="clock" role="img" aria-label="analog clock"><circle cx="50" cy="50" r="47" class="c-face"/>'+t+nums+hand(((hh%12)+mm/60)*30,22,'c-h')+hand(mm*6,32,'c-m')+'<circle cx="50" cy="50" r="2.5" class="c-dot"/></svg>';

var AO=[['cat','🐱'],['ball','⚽'],['teddy bear','🧸'],['book','📕'],['duck','🦆'],['shoe','👟']];
function genScene(prep){
  prep=prep||pick(PREPS,1)[0];
  var a=pick(AO,1)[0],b;
  if(prep==='in')b='box';else if(prep==='under')b='table';
  else if(prep==='on')b=pick(['box','table'],1)[0];
  else if(prep==='between')b='box';
  else b=pick(['box','chair'],1)[0];
  return {a:a,prep:prep,b:b,c:prep==='between'?'chair':null};
}

function sceneSVG(sc){

/* ---------- quiz engine ---------- */
function runQuiz(cfg){
  var queue=cfg.shuffle===false?cfg.items.slice():shuffle(cfg.items);
  if(cfg.n)queue=queue.slice(0,cfg.n);
  var total=queue.length,i=0,score=0,mult=cfg.mult||1,roundStars=0,startLevel=levelOf(meta.stars),startStk=stkIds();
  function draw(){
    if(i>=queue.length)return finish();
    var it=queue[i],answered=false,attempts=0;
    var isType=it.kind==='type';
    var opts=isType?null:(it.keep?it.opts:shuffle(it.opts));
    var html=topbar(cfg.title,true)+
      '<div class="prog"><span>'+(it.again?'ניסיון נוסף':'שאלה '+Math.min(i+1,total)+' מתוך '+total)+'</span><div class="meter"><i style="width:'+Math.round(i/queue.length*100)+'%"></i></div><span class="starcount">'+STAR+roundStars+'</span></div>'+
      '<section class="qcard">'+
      (it.ins?'<p class="ins">'+it.ins+'</p>':'')+
      (it.vis?'<div class="vis">'+it.vis+'</div>':'')+
      (it.q?'<p class="q" dir="auto">'+it.q+'</p>':'')+
      (it.extra?it.extra:'')+
      (it.speak&&TTS?'<div><button class="icon" id="spk" aria-label="השמעה">'+SPK+'</button></div>':'')+
      (isType?
        '<input class="txt" id="ans" dir="auto" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(it.ph||'')+'" aria-label="תשובה">'+
        '<div class="row-btns"><button class="btn" id="chk">בדיקה</button><button class="btn ghost" id="skip" hidden>הצגת התשובה</button></div>'
       :'<div class="opts '+(it.cls||'')+'" dir="'+(it.optDir||'auto')+'">'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'" dir="auto">'+o.t+'</button>';}).join('')+'</div>')+
      '<div class="fb" id="fb" role="status" aria-live="polite"></div>'+
      '<div><button class="btn" id="next" hidden>'+(i+1<queue.length?'הבא':'סיום')+'</button></div>'+
      '</section>';
    $app.innerHTML=html;wireBack();
    var fb=document.getElementById('fb'),next=document.getElementById('next');
    var spk=document.getElementById('spk');
    if(spk){spk.addEventListener('click',function(){say(it.speak);});if(it.autoSpeak)say(it.speak);}
    next.addEventListener('click',function(){i++;draw();window.scrollTo(0,0);});
    function done(ok,msg){
      answered=true;
      var gain=0;
      if(it.id&&!it.again)rec(it.id,ok&&(!isType||attempts===1));
      if(ok){if(!it.again){score++;gain=mult;roundStars+=mult;addStars(mult);chime();}if(it.sayOk)say(it.sayOk);}
      else if(!it.again){var c={};for(var p in it)c[p]=it[p];c.again=true;queue.push(c);}
      fb.className='fb '+(ok?'good':'bad');fb.innerHTML=msg+(gain?' <span class="plus">+'+gain+' '+STAR+'</span>':'')+(it.note?'<div class="ins">'+it.note+'</div>':'');
      next.hidden=false;next.focus();
    }
    if(!isType){
      var btns=Array.prototype.slice.call($app.querySelectorAll('.opt'));
      btns.forEach(function(b,k){b.addEventListener('click',function(){
        if(answered)return;
        btns.forEach(function(x,j){x.disabled=true;if(opts[j].ok)x.classList.add('ok');});
        var ok=opts[k].ok;if(!ok)b.classList.add('no');
        done(ok,ok?pick(PRAISE,1)[0]:'לא בדיוק. התשובה הנכונה מסומנת בירוק.');
      });});
    }else{
      var inp=document.getElementById('ans'),chk=document.getElementById('chk'),skip=document.getElementById('skip');
      var reveal=function(){inp.disabled=true;chk.hidden=true;skip.hidden=true;done(false,'התשובה: '+(it.reveal||''));};
      var check=function(){
        if(answered)return;
        var v=inp.value;if(!v.trim()){inp.focus();return;}
        var r=it.check?it.check(v):defaultCheck(it,v);
        attempts++;
        if(r.ok){inp.disabled=true;chk.hidden=true;skip.hidden=true;done(true,pick(PRAISE,1)[0]+(r.html||''));}
        else if(attempts>=2){reveal();}
        else{fb.className='fb bad';fb.innerHTML=(r.html||'לא בדיוק. נסו שוב.');skip.hidden=false;inp.focus();}
      };
      chk.addEventListener('click',check);skip.addEventListener('click',reveal);
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});
      inp.focus({preventScroll:true});
    }
  }
  function finish(){
    var pct=total?Math.round(score/total*100):0;
    var old=prog[cfg.key]||{best:0,plays:0};
    prog[cfg.key]={best:Math.max(old.best,pct),plays:old.plays+1};saveProg();
    var msg=pct>=90?'מעולה! אתם מוכנים לנושא הזה.':pct>=70?'יפה מאוד. עוד סבב אחד ותהיו שם.':'ממשיכים לתרגל. כל סבב משפר.';
    var bonus=(pct===100?5:pct>=80?3:0)*mult;
    touchDay();if(bonus){addStars(bonus);roundStars+=bonus;}else{saveMeta();}
    if(cfg.onFinish)cfg.onFinish(score,total);
    refreshStickers();
    var lv=levelOf(meta.stars);
    var newStk=stkAll().filter(function(x){return x.ok&&startStk.indexOf(x.id)<0;});
    var share=cfg.shareText?cfg.shareText(score,total):'';
    $app.innerHTML=topbar(cfg.title,true)+'<section class="qcard score"><div class="big">'+score+'/'+total+'</div><p style="margin:0;font-size:1.15rem">'+msg+'</p>'+
      '<p class="earn">+'+roundStars+' '+STAR+'</p>'+(bonus?'<p class="ins" style="margin:0">כולל בונוס של '+bonus+' על סבב מוצלח</p>':'')+
      (lv>startLevel?'<p class="lvup">עליתם לרמה חדשה: <b class="en">'+LEVELS[lv][1]+'</b> · '+LEVELS[lv][2]+'</p>':'')+
      (newStk.length?'<div class="newstk"><p style="margin:0">מדבקה חדשה באלבום!</p><div class="nsrow">'+newStk.map(function(x){return '<span class="stk got"><span class="se">'+x.e+'</span><bdi class="en">'+esc(x.n)+'</bdi></span>';}).join('')+'</div></div>':'')+
      (share?'<textarea class="ta" id="fshare" readonly aria-label="תוצאה לשיתוף" style="direction:rtl;text-align:right;word-break:normal">'+esc(share)+'</textarea><div class="fb" id="fsm" role="status"></div>':'')+
      '<div class="row-btns">'+(share?'<button class="btn wa" id="fwa">שיתוף בוואטסאפ</button><button class="btn" id="fimg">שיתוף תמונה</button><button class="btn ghost" id="fsb">העתקה</button>':'')+(cfg.noAgain?'':'<button class="btn" id="again">סבב חדש</button>')+'<button class="btn ghost" id="out">חזרה</button></div></section>';
    wireBack();
    if(bonus||lv>startLevel||newStk.length){fanfare();burst();}
    if(share){document.getElementById('fsb').addEventListener('click',function(){copyText(share,document.getElementById('fshare'),document.getElementById('fsm'));});
      document.getElementById('fwa').addEventListener('click',function(){openWA(withUrl(share));});
      document.getElementById('fimg').addEventListener('click',shareImage);}
    var ag=document.getElementById('again');
    if(ag)ag.addEventListener('click',function(){runQuiz({key:cfg.key,title:cfg.title,items:cfg.regen(),regen:cfg.regen,n:cfg.n,shuffle:cfg.shuffle,mult:cfg.mult});window.scrollTo(0,0);});
    document.getElementById('out').addEventListener('click',back);
  }
  draw();
}
function norm(s){return String(s).toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();}
function defaultCheck(it,v){
  var ok=it.answers.some(function(a){return norm(a)===norm(v);});
  return {ok:ok,html:''};
}
function runMode(topic,m){
  var mk=m.mk;
  go(function(){runQuiz({key:topic.id+'.'+m.id,title:m.label,items:mk(),regen:mk,n:m.n,shuffle:m.shuffle});});
}

var KNOWN={};'the is are a and cat ball teddy bear book duck shoe box table chair in on under next to behind front of between'.split(' ').forEach(function(w){KNOWN[w]=1;});
function checkSentence(v,sc){
  var t=v.trim(),low=t.toLowerCase().replace(/[.,!?]/g,'').replace(/\s+/g,' ');
  var words=low.split(' ').filter(Boolean);
  var r1=/^[A-Z]/.test(t),r2=/\.$/.test(t);
  var r3=(' '+low+' ').indexOf(' '+sc.prep+' ')>=0;
  var r4=/(^| )(is|are)( |$)/.test(low);
  var unknown=words.filter(function(w){return !KNOWN[w];});
  var r5=words.length>0&&unknown.length===0;
  var iA=low.indexOf(sc.a[0]),iP=(' '+low+' ').indexOf(' '+sc.prep+' ')-1,iB=low.lastIndexOf(sc.b);
  var r6=iA>=0&&iP>iA&&iB>iP&&(!sc.c||low.lastIndexOf(sc.c)>iB);
  var ok=r1&&r2&&r3&&r4&&r5&&r6;
  var row=function(b,s){return '<li class="'+(b?'':'no')+'">'+s+'</li>';};
  var html='<ul class="rub">'+row(r1,'אות גדולה בתחילת המשפט')+row(r2,'נקודה בסוף המשפט')+row(r3,'מילת היחס הנכונה')+row(r4,'המילה is / are')+row(r5,'איות תקין'+(unknown.length&&words.length?' (בדקו: <bdi class="en">'+esc(unknown.join(', '))+'</bdi>)':''))+row(r6,'המשפט מתאר את התמונה')+'</ul>';
  return {ok:ok,html:html};
}

function chipsOf(list){return list.map(function(x){return '<button class="wc st-'+st(x.id)+'" data-id="'+esc(x.id)+'"><bdi class="en">'+MARK[st(x.id)]+esc(x.label)+'</bdi></button>';}).join('');}
function listOf(list){return '<ul class="il">'+list.map(function(x){return '<li class="st-'+st(x.id)+'"><bdi class="en">'+MARK[st(x.id)]+esc(x.label)+'</bdi></li>';}).join('')+'</ul>';}
function detailsOf(title,list){var c=cnt(list);return '<details class="dd"><summary><span>'+title+'</span><span>'+c.m+'/'+list.length+'</span></summary>'+listOf(list)+'</details>';}
function chartSVG(){
  var a=[],i,max=10;
  for(i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dstr(d);
    var v=(meta.hist&&meta.hist[k])||0;if(meta.todayD===k&&meta.today>v)v=meta.today;
    a.push({v:v,w:'אבגדהוש'.charAt(d.getDay()),n:d.getDate(),now:i===0});if(v>max)max=v;}
  var g='<line x1="0" y1="100" x2="420" y2="100" class="ch-base"/>';
  a.forEach(function(x,j){var h=Math.round(x.v/max*78),bx=j*30+5;
    if(x.v>0)g+='<rect x="'+bx+'" y="'+(100-h)+'" width="20" height="'+h+'" rx="3" class="ch-bar"/><text x="'+(bx+10)+'" y="'+(100-h-4)+'" text-anchor="middle" class="ch-v">'+x.v+'</text>';
    g+='<text x="'+(bx+10)+'" y="113" text-anchor="middle" class="ch-t"'+(x.now?' style="font-weight:700"':'')+'>'+x.w+'</text><text x="'+(bx+10)+'" y="125" text-anchor="middle" class="ch-t">'+x.n+'</text>';});
  return '<svg viewBox="0 0 420 130" class="chart" role="img" aria-label="כוכבים ב-14 הימים האחרונים">'+g+'</svg>';
}
function weakOf(U){
  return allOf(U).filter(function(x){var r=items[x.id];return r&&r.w>0&&st(x.id)!=='m';}).sort(function(a,b){return items[b.id].w-items[a.id].w;});
}
function buildWeak(ids){
  var gens=[mkGap,mkMagic,mkWHtap,mkWHans,mkWHmean,mkVEnHe,mkVHeEn,mkVType,mkCloze,mkClkA,mkClkB,mkClkD,mkClkW,mkDaysRel,mkDaysHeb,mkPrepFill,mkPrepPick,mkPrepMean,mkWrite];
  if(TTS)gens.push(mkListen);
  var cand={};
  function add(arr){arr.forEach(function(it){if(it.id&&ids.indexOf(it.id)>=0)(cand[it.id]=cand[it.id]||[]).push(it);});}
  for(var r=0;r<30;r++){gens.forEach(function(g){try{add(g());}catch(e){}});}
  [P1,P2,P3].forEach(function(pp){add(mkRead(pp));});
  return ids.map(function(id){return cand[id]?pick(cand[id],1)[0]:null;}).filter(Boolean);
}
function dashboard(){
  var U=mkUniverse(),map={},all=allOf(U);
  all.forEach(function(x){map[x.id]=x;});
  var tot=cnt(all),pct=all.length?Math.round(tot.m/all.length*100):0;
  var rounds=0;for(var k in prog){if(prog[k]&&prog[k].plays)rounds+=prog[k].plays;}
  var C=2*Math.PI*42;
  var pw=function(p){return U.words.filter(function(x){return x.pos===p;});};
  var vw=U.words.filter(function(x){return x.pos==='adj'||x.pos==='noun'||x.pos==='verb';});
  var topics=[['חוקי קריאה וצלילים',U.sounds],['מילות שאלה',pw('wh').concat(U.wh)],['אוצר מילים',vw.concat(U.cloze)],['השעון',U.clock],['ימות השבוע',U.days],['מילות יחס',pw('prep').concat(U.prepPics)],['הבנת הנקרא',U.read],['כתיבה',U.write]];
  var nm=prog['name.caps'];
  var weak=weakOf(U),wFilter='all';
  var sentGroups=[['משפטי השלמה',U.cloze],['משפטי שאלה ותשובה',U.wh],['שאלות הבנת הנקרא',U.read],['כתיבת משפטי יחס',U.write]];
  var wcats=[['all','הכול'],['adj','תארים'],['noun','שמות עצם'],['verb','פעלים'],['wh','שאלה'],['prep','יחס']];
  var h=topbar('לוח התקדמות',true)+'<div class="dash">'+
   '<section class="panel"><div class="hero2"><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="'+pct+' אחוז"><circle cx="50" cy="50" r="42" class="bg"/><circle cx="50" cy="50" r="42" class="fg" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/><text x="50" y="57" text-anchor="middle">'+pct+'%</text></svg>'+
   '<div class="kpis"><div class="kpi"><b>'+tot.m+'/'+all.length+'</b><span>פריטים נלמדו</span></div><div class="kpi"><b>'+tot.p+'</b><span>בתרגול</span></div><div class="kpi"><b>'+meta.stars+'</b><span>כוכבים</span></div><div class="kpi"><b>'+rounds+'</b><span>סבבים</span></div></div></div>'+
   '<div class="legend"><span><i class="dot m"></i>✓ נלמד</span><span><i class="dot p"></i>• בתרגול</span><span><i class="dot n"></i>טרם תורגל</span></div>'+
   '<p class="gloss">נלמד = שתי תשובות נכונות ברצף בניסיון הראשון. טעות מחזירה את הרצף לאפס.</p></section>'+
   '<section class="panel"><h2>14 הימים האחרונים</h2>'+chartSVG()+'<p class="gloss">כוכבים שנאספו בכל יום. כוכבים מלפני העדכון האחרון לא מפורטים כאן.</p></section>'+
   '<section class="panel"><h2>לפי נושא</h2><div class="trow"><div class="l"><span>1. כתיבת שם</span><span>'+(nm?'הושלם '+nm.best+'%':'לא התחיל')+'</span></div></div>'+
   topics.map(function(t,i){var c=cnt(t[1]);return '<div class="trow"><div class="l"><span>'+(i+2)+'. '+t[0]+'</span><span>'+c.m+'/'+t[1].length+'</span></div>'+segBar(c,t[1].length)+'</div>';}).join('')+'</section>'+
   '<section class="panel"><h2>מילים</h2><div id="wsum"></div><div class="chips" id="wchips">'+wcats.map(function(c){return '<button class="chip" data-c="'+c[0]+'" aria-pressed="'+(c[0]==='all')+'">'+c[1]+'</button>';}).join('')+'</div><div class="wcs" id="wgrid"></div><div class="wdet" hidden></div></section>'+
   '<section class="panel"><h2>משפטים</h2>'+sentGroups.map(function(g){return detailsOf(g[0],g[1]);}).join('')+'</section>'+
   '<section class="panel"><h2>שעון</h2><div class="trow">'+segBar(cnt(U.clock),U.clock.length)+'</div><div class="wcs">'+chipsOf(U.clock)+'</div><div class="wdet" hidden></div></section>'+
   '<section class="panel"><h2>ימות השבוע</h2><div class="wcs">'+chipsOf(U.days)+'</div><div class="wdet" hidden></div></section>'+
   '<section class="panel"><h2>מילות יחס בתמונות</h2><div class="wcs">'+chipsOf(U.prepPics)+'</div><div class="wdet" hidden></div></section>'+
   '<section class="panel"><h2>צלילים</h2>'+detailsOf('האזנה, צירופי אותיות ו-Magic e',U.sounds)+'</section>'+
   '<section class="panel"><h2>לחזק</h2>'+(weak.length?weak.slice(0,8).map(function(x){return '<div class="wk"><bdi class="en">'+esc(x.label)+'</bdi><span>✗ '+items[x.id].w+'</span></div>';}).join('')+'<div><button class="btn" id="weakgo">תרגול הפריטים האלה</button></div>':'<p class="ins" style="margin:0">אין כרגע פריטים שצריך לחזק. כל טעות תופיע כאן.</p>')+'</section></div>';
  $app.innerHTML=h;wireBack();
  function wire(scope){
    Array.prototype.forEach.call(scope.querySelectorAll('.wc'),function(b){b.addEventListener('click',function(){
      var x=map[b.getAttribute('data-id')],r=items[x.id]||{c:0,w:0},box=b.parentNode.nextElementSibling;
      var snd=TTS&&(x.pos||x.id.indexOf('d:')===0||x.id.indexOf('p:')===0);
      box.innerHTML='<b class="en">'+esc(x.label)+'</b>'+(x.sub?'<span>'+esc(x.sub)+'</span>':'')+'<span>'+STX[st(x.id)]+'</span><span>✓ '+r.c+' · ✗ '+r.w+'</span>'+(snd?'<button class="icon" aria-label="השמעה">'+SPK+'</button>':'');
      box.hidden=false;
      var sb=box.querySelector('button');if(sb)sb.addEventListener('click',function(){say(x.label);});
    });});
  }
  function drawWords(){
    var list=wFilter==='all'?U.words:U.words.filter(function(x){return x.pos===wFilter;}),c=cnt(list);
    document.getElementById('wsum').innerHTML='<div class="trow"><div class="l"><span>נלמדו</span><span>'+c.m+'/'+list.length+'</span></div>'+segBar(c,list.length)+'</div>';
    var g=document.getElementById('wgrid');g.innerHTML=chipsOf(list);wire(g);
    g.nextElementSibling.hidden=true;
  }
  drawWords();
  Array.prototype.forEach.call(document.querySelectorAll('#wchips .chip'),function(b){b.addEventListener('click',function(){
    wFilter=b.getAttribute('data-c');
    Array.prototype.forEach.call(document.querySelectorAll('#wchips .chip'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
    drawWords();
  });});
  wire($app);
  var wg=document.getElementById('weakgo');
  if(wg)wg.addEventListener('click',function(){
    var ids=weakOf(U).slice(0,10).map(function(x){return x.id;});
    var its=buildWeak(ids);
    if(!its.length)return;
    go(function(){runQuiz({key:'weak',title:'תרגול הפריטים החלשים',items:its,regen:function(){return buildWeak(weakOf(mkUniverse()).slice(0,10).map(function(x){return x.id;}));}});});
  });
}

function makeCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({p:prog,m:meta,i:items}))));}
function readCode(c){return JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s/g,'')))));}
function copyText(text,ta,msgEl){
  var okMsg='הועתק';
  function fallback(){try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);msgEl.textContent='סימנו את הטקסט. לחצו והעתיקו ידנית.';}catch(e){}}
  try{navigator.clipboard.writeText(text).then(function(){msgEl.textContent=okMsg;},fallback);}catch(e){fallback();}
}
function myStars(){
  var L=levelOf(meta.stars),sc=meta.stars;
  var shareText=function(){return 'תרגול אנגלית · כיתה '+CLASS.name+'\n'+(meta.name?meta.name+': ':'')+meta.stars+' כוכבים · רמה '+LEVELS[L][1]+' · רצף '+streakNow()+' ימים\nמי אוסף יותר?';};
  $app.innerHTML=topbar('הכוכבים שלי',true)+
   '<section class="qcard"><div class="score" style="padding:0"><div class="big">'+STAR+' '+meta.stars+'</div><p style="margin:0"><b class="en">'+LEVELS[L][1]+'</b> · '+LEVELS[L][2]+'</p></div>'+
   '<label class="ins" for="nm">איך קוראים לכם? (יופיע בהודעה שמשתפים)</label><input class="txt" id="nm" dir="auto" type="text" autocomplete="off" maxlength="24" value="'+esc(meta.name||'')+'">'+
   '<div class="row-btns"><button class="btn wa" id="shwa">שיתוף בוואטסאפ</button><button class="btn" id="shimg">שיתוף תמונה</button><button class="btn ghost" id="share">העתקת הודעה</button></div><textarea class="ta" id="sharebox" readonly aria-label="הודעה לשיתוף" style="direction:rtl;text-align:right;word-break:normal">'+esc(shareText())+'</textarea><div class="fb" id="sm" role="status"></div></section>'+
   '<div class="row-btns" style="margin-top:12px"><button class="btn ghost" id="mute">'+(meta.mute?'הפעלת צלילים':'השתקת צלילים')+'</button></div>'+
   '<h2 class="sec">רמות</h2><ul class="ladder">'+LEVELS.map(function(l,k){return '<li class="'+(sc>=l[0]?'got':'')+'">'+(sc>=l[0]?STAR:'')+'<b class="en">'+l[1]+'</b><span>'+l[2]+'</span><span class="n">'+l[0]+' כוכבים</span></li>';}).join('')+'</ul>'+
   '<h2 class="sec">אותות נושא</h2><p class="ins" style="margin:0 0 10px">מקבלים אות כשמגיעים ל-80% לפחות בכל התרגילים של הנושא.</p><div class="badges">'+TOPICS.map(function(t){
     var got=t.modes.every(function(m){var p=prog[t.id+'.'+m.id];return m.run||(p&&p.best>=80);});
     return '<div class="badge '+(got?'got':'')+'"><span class="tile" style="--h:'+t.h+'">'+t.n+'</span><span>'+t.he+'</span></div>';}).join('')+'</div>'+
   '<h2 class="sec">גיבוי</h2><p class="ins" style="margin:0 0 10px">הכוכבים נשמרים בדפדפן של המכשיר. כדי לעבור למכשיר אחר, העתיקו את הקוד והדביקו אותו שם.</p>'+
   '<textarea class="ta" id="code" readonly aria-label="קוד גיבוי"></textarea><div class="row-btns" style="margin:8px 0 14px"><button class="btn ghost" id="cc">העתקת קוד</button></div>'+
   '<textarea class="ta" id="restore" placeholder="הדביקו כאן קוד גיבוי" aria-label="שחזור מקוד"></textarea><div class="row-btns" style="margin-top:8px"><button class="btn ghost" id="rs">שחזור</button></div><div class="fb" id="rm" role="status"></div>';
  wireBack();
  document.getElementById('code').value=makeCode();
  var nm=document.getElementById('nm'),sb=document.getElementById('sharebox'),sm=document.getElementById('sm');
  document.getElementById('mute').addEventListener('click',function(){meta.mute=!meta.mute;saveMeta();this.textContent=meta.mute?'הפעלת צלילים':'השתקת צלילים';if(!meta.mute)chime();});
  nm.addEventListener('input',function(){meta.name=nm.value.trim();saveMeta();sb.value=shareText();});
  document.getElementById('share').addEventListener('click',function(){copyText(shareText(),sb,sm);});
  document.getElementById('shwa').addEventListener('click',function(){openWA(withUrl(shareText()));});
  document.getElementById('shimg').addEventListener('click',shareImage);
  document.getElementById('cc').addEventListener('click',function(){copyText(makeCode(),document.getElementById('code'),sm);});
  var armed=false,rs=document.getElementById('rs'),rm=document.getElementById('rm');
  rs.addEventListener('click',function(){
    var raw=document.getElementById('restore').value;
    if(!raw.trim()){rm.className='fb bad';rm.textContent='הדביקו קוד קודם.';return;}
    var o;try{o=readCode(raw);if(!o||typeof o.p!=='object'||typeof o.m!=='object')throw 0;}catch(e){rm.className='fb bad';rm.textContent='הקוד לא תקין.';armed=false;rs.textContent='שחזור';return;}
    if(!armed){armed=true;rs.textContent='לחצו שוב לאישור: זה מחליף את מה ששמור כאן';return;}
    prog=o.p;for(var k in o.m){meta[k]=o.m[k];}if(o.i&&typeof o.i==='object'){items=o.i;saveItems();}saveProg();saveMeta();
    rm.className='fb good';rm.textContent='השחזור הושלם.';armed=false;rs.textContent='שחזור';
    nav.pop();go(myStars);
  });
}
home();
})();
</script>
